<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Animated Login Form</title>

</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form id="loginForm" class="login-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" [(ngModel)]="loginObj.username" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password"  [(ngModel)]="loginObj.password" id="password" name="password" required>
        </div>
        <button type="submit" (click)="onLogin()">Login</button>
        <p id="error" class="error-message"></p>
    </form>
</div>

</body>
</html>
